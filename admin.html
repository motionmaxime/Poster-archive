<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — Poster Archive</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<header><a href="/">← Voir l’archive</a><span>POSTER ARCHIVE / ADMIN</span></header>
<main>
<h1>Ajouter un poster</h1>
<p>Un nom, une date et votre affiche. Elle apparaîtra dans l’archive dès son enregistrement.</p>
<form id="poster-form">
<label for="name">Nom</label><input id="name" name="name" maxlength="120" required placeholder="Nom du poster">
<label for="date">Date de création</label><input id="date" name="date" type="date" required>
<label for="image">Image</label><input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp" required aria-describedby="image-help">
<small id="image-help">PNG, JPEG ou WebP · 10 Mo maximum</small>
<img id="preview" alt="Aperçu du poster" hidden>
<button type="submit">Ajouter à l’archive</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
<section><h2>Posters dans l’archive</h2><p id="list-status" role="status"></p><div id="posters"></div></section>
</main><script src="/admin.js"></script>
</body></html>
